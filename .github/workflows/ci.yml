name: CI
on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Run the single-patch test even if the patch version did not change"
        required: true
        type: boolean
        default: false

# Avoid overlapping CI checks/builds and races while updating the update branch.
concurrency:
  group: my-youtube-morphe-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Should build?
        id: should_build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.force_build }}" = "true" ]; then
            echo "Forced single-patch test requested."
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
          elif ! git checkout origin/update build.md; then
            echo "First build: no previous build.md found."
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
          else
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ -n "$UPDATE_CFG" ]; then
              echo "Patch/config update detected: $UPDATE_CFG"
              echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
            else
              echo "No patch update detected; skipping build."
              echo "SHOULD_BUILD=0" >> "$GITHUB_OUTPUT"
            fi
          fi

    outputs:
      SHOULD_BUILD: ${{ steps.should_build.outputs.SHOULD_BUILD }}

  build:
    permissions: write-all
    needs: check
    uses: ./.github/workflows/build.yml
    if: ${{ needs.check.outputs.SHOULD_BUILD == 1 }}
    secrets: inherit
