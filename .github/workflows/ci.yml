name: CI
on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Run the single-patch test even if the patch version did not change"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "0 0-23/3 * * *"

# Avoid overlapping CI checks/builds and races while updating the update branch.
concurrency:
  group: my-youtube-morphe-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check YouTube patches
        id: youtube
        shell: bash
        run: |
          set -euo pipefail
          if [ "\${{ inputs.force_build }}" = "true" ] || ! git checkout origin/update -- build-youtube.md 2>/dev/null; then
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
          else
            cp build-youtube.md build.md
            UPDATE_CFG=$(./build.sh config-youtube.toml --config-update)
            echo "SHOULD_BUILD=$([[ -n "$UPDATE_CFG" ]] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Music patches
        id: music
        shell: bash
        run: |
          set -euo pipefail
          if [ "\${{ inputs.force_build }}" = "true" ] || ! git checkout origin/update -- build-music.md 2>/dev/null; then
            echo "SHOULD_BUILD=1" >> "$GITHUB_OUTPUT"
          else
            cp build-music.md build.md
            UPDATE_CFG=$(./build.sh config-music.toml --config-update)
            echo "SHOULD_BUILD=$([[ -n "$UPDATE_CFG" ]] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
          fi

    outputs:
      YOUTUBE: \${{ steps.youtube.outputs.SHOULD_BUILD }}
      MUSIC: \${{ steps.music.outputs.SHOULD_BUILD }}

  build_youtube:
    permissions: write-all
    needs: check
    if: \${{ needs.check.outputs.YOUTUBE == 1 }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: config-youtube.toml
      release_prefix: "YouTube Morphe"
      app_id: youtube
      from_ci: false
    secrets: inherit

  build_music:
    permissions: write-all
    needs: [check, build_youtube]
    if: \${{ always() && needs.check.outputs.MUSIC == 1 && (needs.build_youtube.result == 'success' || needs.build_youtube.result == 'skipped') }}
    uses: ./.github/workflows/build.yml
    with:
      config_file: config-music.toml
      release_prefix: "Music Morphe"
      app_id: music
      from_ci: false
    secrets: inherit
