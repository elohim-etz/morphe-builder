name: Build Morphe
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true

  workflow_dispatch:

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Update config
        if: ${{ inputs.from_ci }}
        run: |
          if git checkout origin/update build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -L 1 | awk -F '\t' '{print $3}')
          if [ -z "$TAG" ]; then TAG=0; fi
          echo "NEXT_VER_CODE=$((TAG + 1))" >> $GITHUB_OUTPUT

      - name: Build modules/APKs
        run: if [ -f "config.json" ]; then ./build.sh config.json; else ./build.sh config.toml; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Get output
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp

      - name: Upload release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Release" --notes "$BODY"
            gh release upload "$TAG" ./build/* --clobber
          else
            gh release create "$TAG" ./build/* --title "Release" --notes "$BODY"
          fi

      - name: Update modules changelog and update json
        id: update_config
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Commit module json changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add build.md *-update.json

          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi

      - name: Report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        if: env.TG_TOKEN != null
        run: |
          cd build || { echo "build folder not found"; exit 1; }

          TG_CHAT="-1003087244808"
          BUILD_NUM="${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
          RELEASE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$BUILD_NUM"
          cd ..

          CLI_VER=$(grep -oPm1 '^CLI:.*?\K[0-9]+(?:\.[0-9]+)+(?:-dev\.[0-9]+)?(?=(?:-[a-zA-Z]+)?\.jar)' build.md || true)
          CLI_VER="${CLI_VER:-N/A}"

          PATCHES_BLOCK=$(awk '
            /^Patches:/ {
              patch_line=$0
              cl_line=""
              if ((getline nxt) > 0 && nxt ~ /^\[Changelog\]/) {
                cl_line=nxt
              }
              key = patch_line "\n" cl_line
              if (!(key in seen)) {
                seen[key]=1
                if (out != "") out = out "\n\n"
                out = out patch_line
                if (cl_line != "") out = out "\n" cl_line
              }
            }
            END { print out }
          ' build.md)
          PATCHES_BLOCK="${PATCHES_BLOCK:-N/A}"

          LINKS=$(printf '%b' "• [GitHub Release](${RELEASE_URL})\n• [Builder Source](https://github.com/elohim-etz/morphe-builder)")

          PKG_LINES=""
          while IFS= read -r line; do
              PKG_NAME=$(echo "$line" | cut -d':' -f1 | sed 's/ ([^)]*)//g' | xargs)
              PKG_VER=$(echo "$line" | cut -d':' -f2 | xargs)

              if [[ "$PKG_LINES" != *"$PKG_NAME"* ]]; then
                  PKG_LINES+=$'\n'"*📦 ${PKG_NAME}:* \`${PKG_VER}\`"
              fi
          done < <(grep -E '^[A-Za-z0-9 _-]+(\s*\([^)]+\))?:\s*[0-9]' build.md)

          MSG=$(printf '%b' "🚀 *New Morphe CI Build Available!*\n${PKG_LINES}\n\n*Build Info:*\n• Build: \`#${BUILD_NUM}\`\n• CLI: \`v${CLI_VER}\`\n\n*Patches:*\n${PATCHES_BLOCK}\n\n*What's Included:*\n• Root modules (Magisk/KernelSU)\n• Non-root APKs (requires MicroG)\n\n*Installation:*\n• Root: Flash module via Magisk/KernelSU\n• Non-root: Install APK + [MicroG-RE](https://github.com/MorpheApp/MicroG-RE/releases)\n\n*Links:*\n${LINKS}\n\n_Built with ❤️ by_ [𝙴𝙻𝙾𝙷𝙸𝙼](https://t.me/elohim152)")

          cd build

          declare -A BEST_APK_FILE
          declare -A BEST_MOD_FILE
          declare -A PKG_APK_URL
          declare -A PKG_MOD_URL
          declare -a PKG_LIST
          declare -A SEEN_PKG

          for OUTPUT in *; do
            [[ $OUTPUT =~ \.(apk|zip)$ ]] || continue

            PKG_NAME="${OUTPUT%%-morphe*}"
            if [[ "$PKG_NAME" == "$OUTPUT" ]]; then
              PKG_NAME="${OUTPUT%-v*}"
              PKG_NAME="${PKG_NAME%-module}"
              PKG_NAME="${PKG_NAME%-*}"
            fi

            if [[ -z "${SEEN_PKG[$PKG_NAME]}" ]]; then
              PKG_LIST+=("$PKG_NAME")
              SEEN_PKG[$PKG_NAME]=1
            fi

            DL_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$BUILD_NUM/${OUTPUT}"

            if [[ $OUTPUT == *.apk ]]; then
              CURRENT_BEST="${BEST_APK_FILE[$PKG_NAME]}"
              if [[ -z "$CURRENT_BEST" ]]; then
                BEST_APK_FILE[$PKG_NAME]="$OUTPUT"
                PKG_APK_URL[$PKG_NAME]="$DL_URL"
              else
                if [[ "$OUTPUT" == *"arm64"* && "$CURRENT_BEST" != *"arm64"* ]]; then
                  BEST_APK_FILE[$PKG_NAME]="$OUTPUT"
                  PKG_APK_URL[$PKG_NAME]="$DL_URL"
                elif [[ "$OUTPUT" != *"arm"* && "$CURRENT_BEST" == *"arm"* && "$CURRENT_BEST" != *"arm64"* ]]; then
                  BEST_APK_FILE[$PKG_NAME]="$OUTPUT"
                  PKG_APK_URL[$PKG_NAME]="$DL_URL"
                fi
              fi
            elif [[ $OUTPUT == *module*.zip ]]; then
              CURRENT_BEST="${BEST_MOD_FILE[$PKG_NAME]}"
              if [[ -z "$CURRENT_BEST" ]]; then
                BEST_MOD_FILE[$PKG_NAME]="$OUTPUT"
                PKG_MOD_URL[$PKG_NAME]="$DL_URL"
              else
                if [[ "$OUTPUT" == *"arm64"* && "$CURRENT_BEST" != *"arm64"* ]]; then
                  BEST_MOD_FILE[$PKG_NAME]="$OUTPUT"
                  PKG_MOD_URL[$PKG_NAME]="$DL_URL"
                elif [[ "$OUTPUT" != *"arm"* && "$CURRENT_BEST" == *"arm"* && "$CURRENT_BEST" != *"arm64"* ]]; then
                  BEST_MOD_FILE[$PKG_NAME]="$OUTPUT"
                  PKG_MOD_URL[$PKG_NAME]="$DL_URL"
                fi
              fi
            fi
          done

          PAIR_ROWS=()
          SINGLE_ROWS=()

          for PKG in "${PKG_LIST[@]}"; do
            APK_URL="${PKG_APK_URL[$PKG]}"
            MOD_URL="${PKG_MOD_URL[$PKG]}"

            DISPLAY_NAME=$(echo "$PKG" | sed -e 's/-/ /g' -e 's/\b\(.\)/\u\1/g')

            if [[ -n "$APK_URL" && -n "$MOD_URL" ]]; then
              PAIR_ROWS+=("{\"text\":\"${DISPLAY_NAME} (APK)\",\"url\":\"${APK_URL}\"},{\"text\":\"${DISPLAY_NAME} (Module)\",\"url\":\"${MOD_URL}\"}")
            elif [[ -n "$APK_URL" ]]; then
              SINGLE_ROWS+=("{\"text\":\"${DISPLAY_NAME} (APK)\",\"url\":\"${APK_URL}\"}")
            elif [[ -n "$MOD_URL" ]]; then
              SINGLE_ROWS+=("{\"text\":\"${DISPLAY_NAME} (Module)\",\"url\":\"${MOD_URL}\"}")
            fi
          done

          BUTTONS='['
          FIRST_ROW=true

          for ROW in "${PAIR_ROWS[@]}"; do
            if [ "$FIRST_ROW" = true ]; then FIRST_ROW=false; else BUTTONS+=','; fi
            BUTTONS+="[$ROW]"
          done

          for ROW in "${SINGLE_ROWS[@]}"; do
            if [ "$FIRST_ROW" = true ]; then FIRST_ROW=false; else BUTTONS+=','; fi
            BUTTONS+="[$ROW]"
          done

          BUTTONS+=']'

          JSON_PAYLOAD=$(jq -n \
            --arg chat_id "$TG_CHAT" \
            --arg text "$MSG" \
            --argjson keyboard "$BUTTONS" \
            '{
              chat_id: $chat_id,
              text: $text,
              parse_mode: "Markdown",
              disable_web_page_preview: true,
              reply_markup: {
                inline_keyboard: $keyboard
              }
            }')

          POST_URL="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          RESPONSE=$(curl -s -X POST "$POST_URL" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Telegram notification sent successfully!"
          else
            echo "Failed to send Telegram notification"
            echo "$RESPONSE"
            exit 1
          fi
